# Publishes the in-browser demo (demo/site, including the packaged model) to GitHub Pages at
# https://<owner>.github.io/<repo>/. One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/site/**"
      - "demo/check_site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits instead of cancelling a deployment in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the packaged model
        run: node demo/check_site.mjs demo/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/site
      - id: deployment
        uses: actions/deploy-pages@v5
